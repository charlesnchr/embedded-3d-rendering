name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  simulator:
    name: simulator (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    steps:
      - uses: actions/checkout@v4
      - name: Build the firmware against the display model
        run: make CC=${{ matrix.cc }}
      - name: Compare every frame with the recorded hashes
        run: make check
      - name: Render one turn of the model
        run: make gif
      - name: Measure the rendering speed
        run: make bench
      - uses: actions/upload-artifact@v4
        with:
          name: spin-${{ matrix.os }}-${{ matrix.cc }}
          path: out/spin.gif
